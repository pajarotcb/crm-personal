<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1120 960" font-family="Georgia, 'Times New Roman', serif">
  <title>Lámina 5 — Maniobras sobre cada punto</title>
  <style>
    .tp{fill:#fff;fill-opacity:.9;stroke:#1a237e;stroke-width:3}
    .n{font:700 16px Helvetica,Arial,sans-serif;fill:#1a237e;text-anchor:middle}
    .h1{font:700 26px Georgia,serif;fill:#111}
    .h2{font:italic 16px Georgia,serif;fill:#444}
    .t{font:700 17px Helvetica,Arial,sans-serif;fill:#111}
    .s{font:15px Helvetica,Arial,sans-serif;fill:#333}
    .c{font:13px Helvetica,Arial,sans-serif;fill:#555}
    .ar{stroke:#1a237e;stroke-width:5;fill:none;marker-end:url(#a2);stroke-linecap:round}
    .ball{fill:#c6e04a;stroke:#6b7d12;stroke-width:3}
  </style>
  <defs><marker id="a2" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1a237e"/></marker></defs>
  <rect width="1120" height="960" fill="#fffdf8"/>
  <text x="40" y="46" class="h1">Lámina 5 · Maniobras sobre cada punto</text>
  <text x="40" y="72" class="h2">Flechas = dirección de la presión · Presión 5–6 de 10 · el dolor debe bajar, no subir</text>

  <svg x="30" y="95" width="720" height="720" viewBox="70 0 640 640" xmlns="http://www.w3.org/2000/svg">
    <image xlink:href="fuente-gray1918/Gray409.png" href="fuente-gray1918/Gray409.png" x="0" y="0" width="733" height="1156"/>
    <!-- 1 pellizco -->
    <path class="ar" d="M312,176 L284,214"/><path class="ar" d="M236,282 L262,246"/>
    <circle class="tp" cx="272" cy="228" r="15"/><text class="n" x="272" y="234">1</text>
    <!-- 3 pulgar esplenio -->
    <path class="ar" d="M488,176 L462,138"/>
    <circle class="tp" cx="452" cy="122" r="15"/><text class="n" x="452" y="128">3</text>
    <!-- 4 pulgar elevador -->
    <path class="ar" d="M560,338 L522,302"/>
    <circle class="tp" cx="505" cy="284" r="15"/><text class="n" x="505" y="290">4</text>
    <!-- 5 pelota -->
    <circle class="ball" cx="212" cy="470" r="26"/>
    <path d="M190,456 C200,470 224,470 234,456 M188,484 C202,478 222,478 236,484" stroke="#6b7d12" stroke-width="2.5" fill="none"/>
    <circle class="tp" cx="212" cy="470" r="15" fill-opacity=".55"/><text class="n" x="212" y="476">5</text>
  </svg>

  <rect x="770" y="95" width="330" height="720" rx="6" fill="#fff" stroke="#c9c4b8"/>
  <text x="786" y="128" class="t">1 · Pellizco (trapecio superior)</text>
  <text x="786" y="152" class="c">Pulgar y dedos toman el músculo, sin</text>
  <text x="786" y="170" class="c">piel. 30–60 s por punto, 1–3 puntos.</text>
  <text x="786" y="206" class="t">3 · Pulgar (esplenio)</text>
  <text x="786" y="230" class="c">Presión suave hacia arriba y adentro,</text>
  <text x="786" y="248" class="c">al costado de la columna, nunca sobre</text>
  <text x="786" y="266" class="c">ella. 30–60 s.</text>
  <text x="786" y="302" class="t">4 · Pulgar (elevador de la escápula)</text>
  <text x="786" y="326" class="c">Pulgar en el ángulo superior de la</text>
  <text x="786" y="344" class="c">paleta, presión hacia el cuello.</text>
  <text x="786" y="362" class="c">30–90 s, 1–2 puntos.</text>
  <text x="786" y="398" class="t">5 · Pelota (infraespinoso)</text>
  <text x="786" y="422" class="c">Pelota de tenis contra la pared, bajo la</text>
  <text x="786" y="440" class="c">espina de la escápula. Apoyar el peso,</text>
  <text x="786" y="458" class="c">sin rodar. 30–60 s.</text>
  <text x="786" y="494" class="t">2 · Peso de la cabeza (suboccipitales)</text>
  <text x="786" y="518" class="c">Acostado boca arriba, dos pelotas bajo</text>
  <text x="786" y="536" class="c">el cráneo, una a cada lado de la</text>
  <text x="786" y="554" class="c">columna. Sin presión extra. 60–90 s.</text>
  <text x="786" y="590" class="t">A otro</text>
  <text x="786" y="614" class="c">Mismas maniobras con el pulpejo del</text>
  <text x="786" y="632" class="c">pulgar. Preguntar siempre: «¿del 1 al</text>
  <text x="786" y="650" class="c">10, cuánto?». Objetivo 5–6. Soltar</text>
  <text x="786" y="668" class="c">despacio.</text>
  <text x="786" y="704" class="t">Parar si hay</text>
  <text x="786" y="728" class="c">dolor agudo, hormigueo, mareo o dolor</text>
  <text x="786" y="746" class="c">que baja al brazo.</text>
  <text x="786" y="782" class="c">Parámetros de trabajo, ver capítulo.</text>

  <line x1="40" y1="860" x2="1080" y2="860" stroke="#c9c4b8"/>
  <text x="40" y="884" class="c">Base anatómica: Gray, H. (1918). <tspan font-style="italic">Anatomy of the Human Body</tspan> (20.ª ed.). Filadelfia: Lea &amp; Febiger. Fig. 409. Dominio público.</text>
  <text x="40" y="903" class="c">Obtenida de Wikimedia Commons (File:Gray409.png). Flechas, pelota y leyenda: elaboración propia. Tiempos y presiones: parámetros de trabajo, no validados.</text>
</svg>
