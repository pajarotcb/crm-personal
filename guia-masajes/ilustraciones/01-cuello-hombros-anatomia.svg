<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 920" font-family="Helvetica, Arial, sans-serif">
  <title>Cuello y hombros — vista posterior</title>
  <style>
    .body{fill:#e3e6ea;stroke:#9aa1ab;stroke-width:2}
    .m1{fill:#e9a06b;fill-opacity:.85;stroke:#b35f27;stroke-width:2}
    .m2{fill:#d96b5f;fill-opacity:.8;stroke:#9c2f24;stroke-width:2}
    .m3{fill:#6aa6c9;fill-opacity:.8;stroke:#2c6a8f;stroke-width:2}
    .m4{fill:#8cc08a;fill-opacity:.85;stroke:#417a3f;stroke-width:2}
    .m5{fill:#b99ad3;fill-opacity:.85;stroke:#6f4c92;stroke-width:2}
    .bone{fill:none;stroke:#6b7280;stroke-width:2.5;stroke-dasharray:6 4}
    .lead{stroke:#4b5563;stroke-width:1.5;fill:none}
    .t{font-size:19px;fill:#111827;font-weight:600}
    .s{font-size:15px;fill:#4b5563}
    .h{font-size:26px;font-weight:700;fill:#111827}
  </style>
  <rect width="800" height="920" fill="#ffffff"/>
  <text x="400" y="42" text-anchor="middle" class="h">Cuello y hombros · vista posterior</text>
  <text x="400" y="68" text-anchor="middle" class="s">Izquierda de la imagen: capa superficial · Derecha: capa profunda (sin trapecio)</text>

  <g transform="translate(0,30)">
  <!-- silhouette -->
  <ellipse class="body" cx="400" cy="165" rx="78" ry="98"/>
  <path class="body" d="M362,250 L360,335 C300,345 215,360 160,425 L125,560 L135,820 L665,820 L675,560 L640,425 C585,360 500,345 440,335 L438,250 Z"/>

  <!-- LEFT: superficial layer - trapezius -->
  <path class="m1" d="M400,248 C350,268 292,330 205,380 L228,400 L300,392 L400,640 L400,248 Z"/>
  <path class="m2" d="M400,250 C350,270 292,332 205,380 L300,372 C330,335 372,310 400,306 Z"/>
  <!-- left scapula + infraspinatus -->
  <path class="bone" d="M290,408 L372,432 L338,575 L295,500 Z"/>
  <path class="bone" d="M290,408 L372,440"/>

  <!-- RIGHT: deep layer -->
  <path class="m3" d="M410,258 L470,262 L522,318 L502,328 L450,292 L410,284 Z"/>
  <path class="m4" d="M432,290 L454,284 L530,404 L508,412 Z"/>
  <path class="m5" d="M405,240 L455,236 L452,252 L405,256 Z"/>
  <!-- right scapula + infraspinatus + rhomboid -->
  <path class="bone" d="M510,408 L428,432 L462,575 L505,500 Z"/>
  <path class="bone" d="M510,408 L428,440"/>
  <path d="M510,452 L436,452 L458,548 L498,498 Z" fill="#e8c84a" fill-opacity=".9" stroke="#9a7d12" stroke-width="2"/>

  <!-- spine -->
  <path class="bone" d="M400,252 L400,640"/>

  <!-- labels left -->
  <path class="lead" d="M290,345 L150,300"/><text class="t" x="20" y="296">Trapecio</text><text class="s" x="20" y="316">superior</text>
  <path class="lead" d="M330,500 L150,520"/><text class="t" x="20" y="520">Trapecio</text><text class="s" x="20" y="540">medio e inferior</text>
  <path class="lead" d="M330,470 L150,620"/><text class="t" x="20" y="630">Escápula</text><text class="s" x="20" y="650">(hueso)</text>

  <!-- labels right -->
  <path class="lead" d="M440,248 L560,200"/><text class="t" x="565" y="196">Suboccipitales</text>
  <path class="lead" d="M475,282 L560,250"/><text class="t" x="565" y="246">Esplenio</text>
  <path class="lead" d="M500,345 L560,330"/><text class="t" x="565" y="326">Elevador de</text><text class="t" x="565" y="348">la escápula</text>
  <path class="lead" d="M470,500 L560,500"/><text class="t" x="565" y="496">Infraespinoso</text>
  <path class="lead" d="M445,445 L560,430"/><text class="s" x="565" y="426">(supraespinoso por</text><text class="s" x="565" y="444">encima de la espina)</text>

  </g>
  <!-- leyenda -->
  <rect x="40" y="690" width="720" height="190" rx="10" fill="#f5f6f8" stroke="#d6dae0"/>
  <text x="60" y="722" class="t">Cómo leer esta lámina</text>
  <text x="60" y="752" class="s">• Líneas punteadas = huesos (escápula y columna). Nunca se presiona sobre la columna.</text>
  <text x="60" y="778" class="s">• Rojo oscuro = trapecio superior, el que más se sobrecarga en cuello y hombros.</text>
  <text x="60" y="804" class="s">• Esquema simplificado y no a escala: sirve para ubicarse, no como atlas anatómico.</text>
  <text x="60" y="830" class="s">• El ECM y los escalenos (laterales del cuello) no se muestran: no se comprimen en casa.</text>
  <text x="60" y="860" class="s">Guía de masajes por zona de dolor · capítulo 1</text>
</svg>
