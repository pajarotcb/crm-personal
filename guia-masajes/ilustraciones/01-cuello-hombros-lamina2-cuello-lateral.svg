<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1120 960" font-family="Georgia, 'Times New Roman', serif">
  <title>Lámina 2 — Músculos del cuello, vista lateral, con zonas de no compresión</title>
  <style>
    .tp{fill:#fff;fill-opacity:.92;stroke:#1a237e;stroke-width:3}
    .n{font:700 17px Helvetica,Arial,sans-serif;fill:#1a237e;text-anchor:middle}
    .h1{font:700 26px Georgia,serif;fill:#111}
    .h2{font:italic 16px Georgia,serif;fill:#444}
    .t{font:700 17px Helvetica,Arial,sans-serif;fill:#111}
    .s{font:15px Helvetica,Arial,sans-serif;fill:#333}
    .c{font:13px Helvetica,Arial,sans-serif;fill:#555}
    .no{fill:url(#hat);stroke:#b71c1c;stroke-width:2.5}
  </style>
  <defs>
    <pattern id="hat" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="9" height="9" fill="#b71c1c" fill-opacity=".10"/><line x1="0" y1="0" x2="0" y2="9" stroke="#b71c1c" stroke-width="3" stroke-opacity=".55"/>
    </pattern>
  </defs>
  <rect width="1120" height="960" fill="#fffdf8"/>
  <text x="40" y="46" class="h1">Lámina 2 · Cuello, vista lateral: dónde sí y dónde no</text>
  <text x="40" y="72" class="h2">Las zonas rayadas en rojo no se comprimen en el masaje casero</text>

  <g transform="translate(30,95) scale(1.25)">
    <image xlink:href="fuente-gray1918/Gray385.png" href="fuente-gray1918/Gray385.png" x="0" y="0" width="553" height="593"/>
    <path class="no" d="M303,111 L350,107 L304,232 L279,432 L264,496 L166,504 L186,432 L214,289 Z"/>
    <path class="no" d="M300,330 L346,322 L342,470 L300,462 Z"/>
    <circle class="tp" cx="398" cy="372" r="11" stroke-width="2.2"/><text class="n" x="398" y="378" style="font-size:13px">1</text>
    <circle class="tp" cx="360" cy="228" r="11" stroke-width="2.2"/><text class="n" x="360" y="234" style="font-size:13px">3</text>
    <circle class="tp" cx="338" cy="262" r="11" stroke-width="2.2"/><text class="n" x="338" y="268" style="font-size:13px">4</text>
  </g>

  <rect x="830" y="95" width="270" height="520" rx="6" fill="#fff" stroke="#c9c4b8"/>
  <text x="846" y="128" class="t">Dónde sí</text>
  <text x="846" y="156" class="s"><tspan font-weight="700" fill="#1a237e">1</tspan> Trapecio superior</text>
  <text x="846" y="182" class="s"><tspan font-weight="700" fill="#1a237e">3</tspan> Esplenio</text>
  <text x="846" y="208" class="s"><tspan font-weight="700" fill="#1a237e">4</tspan> Elevador de la escápula</text>
  <rect x="846" y="248" width="30" height="16" class="no"/>
  <text x="886" y="261" class="t">No comprimir</text>
  <text x="846" y="290" class="s">• Esternocleidomastoideo (sterno-cleido-</text>
  <text x="846" y="308" class="s">  mastoideus): solo pellizco suave.</text>
  <text x="846" y="334" class="s">• Escalenos: no se tratan en casa.</text>
  <text x="846" y="372" class="c">Junto a estos músculos pasan la arteria</text>
  <text x="846" y="390" class="c">carótida, la vena yugular y el plexo</text>
  <text x="846" y="408" class="c">braquial (nervios del brazo). Presionar</text>
  <text x="846" y="426" class="c">fuerte puede causar mareo, hormigueo</text>
  <text x="846" y="444" class="c">o lesiones.</text>
  <text x="846" y="482" class="c">Si al masajear se siente un pulso fuerte,</text>
  <text x="846" y="500" class="c">soltar y reubicar la mano más atrás,</text>
  <text x="846" y="518" class="c">sobre el borde del trapecio.</text>
  <text x="846" y="556" class="c">Rótulos originales en inglés/latín:</text>
  <text x="846" y="574" class="c">Splenius = esplenio · Levator scap. =</text>
  <text x="846" y="592" class="c">elevador de la escápula · Scalenus =</text>
  <text x="846" y="610" class="c">escaleno.</text>

  <line x1="40" y1="900" x2="1080" y2="900" stroke="#c9c4b8"/>
  <text x="40" y="924" class="c">Base anatómica: Gray, H. (1918). <tspan font-style="italic">Anatomy of the Human Body</tspan> (20.ª ed.). Filadelfia: Lea &amp; Febiger. Fig. 385. Dominio público.</text>
  <text x="40" y="943" class="c">Obtenida de Wikimedia Commons (File:Gray385.png). Marcas, zonas rayadas y leyenda: elaboración propia; ubicación orientativa.</text>
</svg>
