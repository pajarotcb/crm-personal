<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 920" font-family="Helvetica, Arial, sans-serif">
  <title>Cuello y hombros — mapa de dolor referido</title>
  <style>
    .body{fill:#e3e6ea;stroke:#9aa1ab;stroke-width:2}
    .pain{fill:#e53935;fill-opacity:.38;stroke:#c62828;stroke-width:1.5;stroke-dasharray:5 3}
    .tp{fill:#fff;stroke:#1a237e;stroke-width:3}
    .b{fill:#1a237e}
    .t{font-size:18px;fill:#111827;font-weight:600}
    .s{font-size:15px;fill:#4b5563}
    .n{font-size:14px;fill:#1a237e;font-weight:700;text-anchor:middle}
    .nb{font-size:13px;fill:#fff;font-weight:700;text-anchor:middle}
    .h{font-size:26px;font-weight:700;fill:#111827}
  </style>
  <rect width="800" height="920" fill="#fff"/>
  <text x="400" y="42" text-anchor="middle" class="h">Dónde duele ≠ dónde está el origen</text>
  <text x="400" y="68" text-anchor="middle" class="s">Círculo azul = punto gatillo (donde se masajea) · Zona roja = donde se siente el dolor</text>

  <!-- PANEL A: cabeza de perfil -->
  <text x="200" y="112" text-anchor="middle" class="t">A · Dónde se siente (perfil)</text>
  <g transform="translate(0,34)">
    <path class="body" d="M110,150 C110,110 150,100 200,104 C260,108 290,150 285,210 C283,240 270,262 255,278 L255,330 L175,330 L175,262 C150,255 125,220 110,150 Z"/>
    <ellipse cx="200" cy="215" rx="9" ry="14" fill="#cfd4da" stroke="#9aa1ab"/>
    <circle cx="262" cy="178" r="5" fill="#6b7280"/>
    <!-- vertex -->
    <ellipse class="pain" cx="190" cy="118" rx="40" ry="13"/>
    <!-- banda occipucio-oreja-ojo -->
    <path d="M122,200 C150,160 205,160 252,182" stroke="#e53935" stroke-opacity=".38" stroke-width="24" stroke-linecap="round" fill="none"/>
    <!-- sien y detrás del ojo -->
    <ellipse class="pain" cx="236" cy="150" rx="26" ry="19"/>
    <ellipse class="pain" cx="262" cy="182" rx="17" ry="15"/>
    <circle class="b" cx="236" cy="150" r="10"/><text class="nb" x="236" y="155">1</text>
    <circle class="b" cx="135" cy="205" r="10"/><text class="nb" x="135" y="210">2</text>
    <circle class="b" cx="190" cy="118" r="10"/><text class="nb" x="190" y="123">3</text>
  </g>

  <!-- PANEL B: vista posterior -->
  <text x="580" y="112" text-anchor="middle" class="t">B · Dónde se masajea (posterior)</text>
  <ellipse class="body" cx="580" cy="190" rx="58" ry="72"/>
  <path class="body" d="M552,252 L550,310 C500,320 440,340 410,390 L400,545 L760,545 L750,390 C720,340 660,320 610,310 L608,252 Z"/>
  <path d="M580,255 L580,545" stroke="#9aa1ab" stroke-width="2" stroke-dasharray="6 4"/>
  <path d="M480,400 L560,420 L530,540 L488,490 Z" fill="none" stroke="#9aa1ab" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M680,400 L600,420 L630,540 L672,490 Z" fill="none" stroke="#9aa1ab" stroke-width="2" stroke-dasharray="5 4"/>
  <!-- puntos (un lado en detalle, el otro tenue) -->
  <circle class="tp" cx="520" cy="330" r="13"/><text class="n" x="520" y="335">1</text>
  <circle class="tp" cx="558" cy="248" r="13"/><text class="n" x="558" y="253">2</text>
  <circle class="tp" cx="530" cy="288" r="13"/><text class="n" x="530" y="293">3</text>
  <circle class="tp" cx="545" cy="402" r="13"/><text class="n" x="545" y="407">4</text>
  <circle class="tp" cx="516" cy="468" r="13"/><text class="n" x="516" y="473">5</text>
  <circle class="tp" cx="640" cy="330" r="13" opacity=".4"/>
  <circle class="tp" cx="602" cy="248" r="13" opacity=".4"/>
  <circle class="tp" cx="630" cy="288" r="13" opacity=".4"/>
  <text x="720" y="300" class="s" text-anchor="middle">(se repite</text>
  <text x="720" y="318" class="s" text-anchor="middle">del otro lado)</text>

  <!-- tabla -->
  <rect x="30" y="575" width="355" height="320" rx="10" fill="#f5f6f8" stroke="#d6dae0"/>
  <text x="48" y="605" class="t">Puntos gatillo y qué producen</text>
  <text x="48" y="635" class="s"><tspan font-weight="700" fill="#1a237e">1</tspan> Trapecio superior → sien y detrás</text>
  <text x="48" y="655" class="s">    del ojo (dolor de cabeza tensional)</text>
  <text x="48" y="683" class="s"><tspan font-weight="700" fill="#1a237e">2</tspan> Suboccipitales → nuca, detrás de</text>
  <text x="48" y="703" class="s">    la oreja, hasta el ojo</text>
  <text x="48" y="731" class="s"><tspan font-weight="700" fill="#1a237e">3</tspan> Esplenio → coronilla y parte</text>
  <text x="48" y="751" class="s">    posterior de la cabeza</text>
  <text x="48" y="779" class="s"><tspan font-weight="700" fill="#1a237e">4</tspan> Elevador de la escápula → cuello</text>
  <text x="48" y="799" class="s">    rígido, dolor en el ángulo de la paleta</text>
  <text x="48" y="827" class="s"><tspan font-weight="700" fill="#1a237e">5</tspan> Infraespinoso → dolor profundo en</text>
  <text x="48" y="847" class="s">    la paleta, a veces baja al brazo</text>
  <text x="48" y="880" class="s" font-style="italic">Patrones orientativos, no un diagnóstico.</text>

  <rect x="410" y="575" width="360" height="320" rx="10" fill="#fff8e1" stroke="#f0d98a"/>
  <text x="428" y="605" class="t">Ojo con estas señales</text>
  <text x="428" y="635" class="s">Si además hay hormigueo, adormecimiento</text>
  <text x="428" y="655" class="s">o debilidad en el brazo, mareo, fiebre o un</text>
  <text x="428" y="675" class="s">golpe reciente: no masajear y consultar.</text>
  <text x="428" y="715" class="t">Nunca presionar</text>
  <text x="428" y="743" class="s">• Parte delantera y laterales del cuello</text>
  <text x="428" y="763" class="s">  (carótida, tiroides).</text>
  <text x="428" y="787" class="s">• Sobre la columna (las vértebras).</text>
  <text x="428" y="831" class="s" font-style="italic">Esquema simplificado y no a escala.</text>
  <text x="428" y="877" class="s">Guía de masajes por zona de dolor · capítulo 1</text>
</svg>
