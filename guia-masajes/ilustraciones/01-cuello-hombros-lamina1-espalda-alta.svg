<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1120 1330" font-family="Georgia, 'Times New Roman', serif">
  <title>Lámina 1 — Músculos de la espalda alta, cuello y hombro (vista posterior) con puntos gatillo</title>
  <style>
    .tp{fill:#fff;fill-opacity:.92;stroke:#1a237e;stroke-width:3}
    .n{font:700 17px Helvetica,Arial,sans-serif;fill:#1a237e;text-anchor:middle}
    .h1{font:700 26px Georgia,serif;fill:#111}
    .h2{font:italic 16px Georgia,serif;fill:#444}
    .t{font:700 17px Helvetica,Arial,sans-serif;fill:#111}
    .s{font:15px Helvetica,Arial,sans-serif;fill:#333}
    .c{font:13px Helvetica,Arial,sans-serif;fill:#555}
    .hl{fill:#c62828;fill-opacity:.22;stroke:#c62828;stroke-width:2.5;stroke-dasharray:7 4}
    .lead{stroke:#1a237e;stroke-width:1.6;fill:none}
  </style>
  <rect width="1120" height="1330" fill="#fffdf8"/>
  <text x="40" y="46" class="h1">Lámina 1 · Espalda alta, cuello y hombro (vista posterior)</text>
  <text x="40" y="72" class="h2">Capa superficial a la izquierda de la imagen · capa profunda a la derecha</text>

  <g transform="translate(20,95)">
    <image xlink:href="fuente-gray1918/Gray409.png" href="fuente-gray1918/Gray409.png" x="0" y="0" width="733" height="1156"/>
    <!-- trapecio superior (referencia) -->
    <path class="hl" d="M322,72 L392,82 L398,228 L330,240 L262,262 L186,292 L128,318 L172,262 L240,200 L300,130 Z"/>
    <!-- puntos gatillo -->
    <circle class="tp" cx="272" cy="228" r="15"/><text class="n" x="272" y="234">1</text>
    <circle class="tp" cx="452" cy="122" r="15"/><text class="n" x="452" y="128">3</text>
    <circle class="tp" cx="505" cy="284" r="15"/><text class="n" x="505" y="290">4</text>
    <circle class="tp" cx="212" cy="470" r="15"/><text class="n" x="212" y="476">5</text>
  </g>

  <!-- leyenda lateral -->
  <rect x="780" y="95" width="320" height="560" rx="6" fill="#fff" stroke="#c9c4b8"/>
  <text x="798" y="128" class="t">Puntos gatillo</text>
  <text x="798" y="160" class="s"><tspan font-weight="700" fill="#1a237e">1</tspan> Trapecio superior</text>
  <text x="798" y="180" class="c">  Dolor referido: sien, detrás del ojo</text>
  <text x="798" y="212" class="s"><tspan font-weight="700" fill="#1a237e">3</tspan> Esplenio (cabeza y cuello)</text>
  <text x="798" y="232" class="c">  Dolor referido: coronilla, occipucio</text>
  <text x="798" y="264" class="s"><tspan font-weight="700" fill="#1a237e">4</tspan> Elevador de la escápula</text>
  <text x="798" y="284" class="c">  Cuello rígido; dolor en ángulo de la paleta</text>
  <text x="798" y="316" class="s"><tspan font-weight="700" fill="#1a237e">5</tspan> Infraespinoso</text>
  <text x="798" y="336" class="c">  Dolor profundo en la paleta y hombro</text>
  <text x="798" y="368" class="s">(El punto 2, suboccipitales, se muestra</text>
  <text x="798" y="388" class="s">en la lámina 3.)</text>
  <rect x="798" y="412" width="30" height="16" class="hl"/>
  <text x="838" y="425" class="s">Trapecio superior</text>
  <text x="798" y="470" class="t">Cómo leer esta lámina</text>
  <text x="798" y="498" class="c">Círculos azules: ubicación aproximada de</text>
  <text x="798" y="516" class="c">los puntos gatillo más frecuentes. La</text>
  <text x="798" y="534" class="c">posición exacta varía entre personas.</text>
  <text x="798" y="562" class="c">Rótulos del dibujo original en inglés/latín:</text>
  <text x="798" y="580" class="c">Trapezius = trapecio · Levator scapulae =</text>
  <text x="798" y="598" class="c">elevador de la escápula · Splenius capitis /</text>
  <text x="798" y="616" class="c">cervicis = esplenio · Infraspinatus =</text>
  <text x="798" y="634" class="c">infraespinoso · Rhomboideus = romboides.</text>

  <!-- cita -->
  <line x1="40" y1="1268" x2="1080" y2="1268" stroke="#c9c4b8"/>
  <text x="40" y="1292" class="c">Base anatómica: Gray, H. (1918). <tspan font-style="italic">Anatomy of the Human Body</tspan> (20.ª ed., W. H. Lewis, ed.). Filadelfia: Lea &amp; Febiger. Fig. 409. Dominio público.</text>
  <text x="40" y="1311" class="c">Obtenida de Wikimedia Commons (File:Gray409.png). Marcas, resaltado y leyenda: elaboración propia; ubicación de puntos orientativa (Travell &amp; Simons).</text>
</svg>
